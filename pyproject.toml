[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-learning-investing"
version = "0.1.0"
description = "Machine learning research strategies for Nordic equities"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "prettytable>=3.0",
    "scikit-learn>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
walk-forward = "walk_forward.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

